<!DOCTYPE html>
<html>
    <head>
        <title>HOTEL ROOM BOOKING </title>
    </head>
    <body>
      <h1 align="center"><mark>HOTEL ROOM BOOKING</mark></h1>
      
      
    <h2>Room Details Table</h2>
    <form action ="#" method="post" align="center">
        <!-- Name -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <!-- Check-in Date -->
        <label for="checkin">Check-in Date:</label>
        <input type="date" id="checkin" name="checkin"><br><br>

        <!-- Check-out Date -->
        <label for="checkout">Check-out Date:</label>
        <input type="date" id="checkout" name="checkout"><br><br>

        <!-- Number of Guests -->
        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" name="guests" min="1" max="10"><br><br>

        <!-- Room Type -->
        <label for="roomtype">Room Type:</label>
        <select id="roomtype" name="roomtype">
            <option value="single">Single</option>
            <option value="double">Double</option>
            <option value="suite">Suite</option>
           <!DOCTYPE html>
 
        </select><br><br>
        

        <!-- Submit Button -->
        <input type="submit" value="Book Room">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
